name: Build & Release DVI Packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # 1. Checkout
      # -----------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------
      # 2. Extract version from tag
      # -----------------------------
      - name: Get version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          # Get the branch name that the tag was created from
          BRANCH=$(git branch -r --contains $GITHUB_SHA | grep -v HEAD | sed 's/.*origin\///' | head -1)
          if [ -z "$BRANCH" ]; then
            BRANCH="main"
          fi
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "Branch: $BRANCH"

      # -----------------------------
      # 3. Build HACS Card Package (dist/)
      # -----------------------------
      - name: Build HACS Card Package
        run: |
          rm -rf dist
          mkdir -p dist

          # Copy card structure exactly as-is from src
          cp src/dvi-card/dvi-heatpump-card.js dist/
          cp -r src/dvi-card/dvi dist/
          
          echo "${{ steps.version.outputs.version }}" > dist/VERSION

          echo "== HACS dist package structure =="
          tree dist/ || find dist -type f -print
          
          echo "== Verifying dvi folder exists =="
          ls -la dist/dvi/ || echo "ERROR: dvi folder not found!"

      - name: Commit dist folder to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Get the branch name from the earlier step
          BRANCH="${{ steps.version.outputs.branch }}"
          echo "Committing to branch: $BRANCH"
          
          # Fetch and checkout the source branch
          git fetch origin $BRANCH
          git checkout $BRANCH
          
          # COMPLETELY REMOVE old dist folder from repository
          git rm -rf dist/ || true
          
          # Ensure ONLY dist folder exists (no release artifacts)
          rm -rf release/ sidecar/ *.tar.gz
          
          # Copy the newly built dist folder
          # (it was built in the detached HEAD state, we need it in the branch)
          
          echo "== Contents of newly built dist =="
          ls -la dist/
          echo "== dvi folder contents =="
          ls -la dist/dvi/ || echo "ERROR: dvi folder missing!"
          
          # Force add all files in dist recursively
          git add -f dist/
          
          echo "== Git status after add =="
          git status
          
          # Commit if there are changes
          if ! git diff --staged --quiet || ! git diff --quiet; then
            git commit -m "Build dist for ${{ steps.version.outputs.version }}"
            
            echo "== Files in commit =="
            git diff --name-only HEAD~1 HEAD
            
            git push origin $BRANCH
          else
            echo "No changes to commit"
          fi
          
          # Go back to tag for release creation
          git checkout ${GITHUB_REF#refs/tags/}

      # -----------------------------
      # 4. Build Bridge Basic Package (RPi)
      # -----------------------------
      - name: Build Bridge Basic Package
        run: |
          mkdir -p release/bridge-basic

          # Core bridge files only
          cp src/bridge/bridge.py release/bridge-basic/
          cp src/bridge/read_static_values_modbustk.py release/bridge-basic/
          cp src/bridge/requirements.txt release/bridge-basic/

          # systemd service file for bridge only
          mkdir -p release/bridge-basic/systemd
          cp src/systemd/bridge.service.example release/bridge-basic/systemd/

          # Version file
          echo "${{ steps.version.outputs.version }}" > release/bridge-basic/VERSION

          # README for bridge installation
          cat > release/bridge-basic/README.md << 'EOF'
          # DVI Bridge Basic Package
          
          This package contains the core MQTT bridge for DVI heat pumps.
          
          ## Installation
          1. Extract to /home/dviha/dvi-bridge/
          2. Create virtual environment and install requirements
          3. Configure .env file with MQTT settings
          4. Set up systemd service
          
          See main repository for detailed instructions.
          EOF

          # Package it
          tar czf release/dvi-bridge-basic-${{ steps.version.outputs.version }}.tar.gz -C release bridge-basic

          echo "== Bridge Basic package =="
          find release/bridge-basic -type f -print

      # -----------------------------
      # 5. Build Sidecar Package (RPi)
      # -----------------------------
      - name: Build Sidecar Package
        run: |
          mkdir -p release/sidecar-package/sidecar/www/dvi-card

          # Copy sidecar Python files
          cp src/sidecar/webbridge.py release/sidecar-package/sidecar/
          cp src/sidecar/entity_map.py release/sidecar-package/sidecar/
          cp src/sidecar/requirements.txt release/sidecar-package/sidecar/

          # Copy existing sidecar www content
          cp -r src/sidecar/www/* release/sidecar-package/sidecar/www/

          # Add the card files for sidecar UI
          cp src/dvi-card/dvi-heatpump-card.js release/sidecar-package/sidecar/www/
          cp -r src/dvi-card/dvi release/sidecar-package/sidecar/www/dvi-card/

          # systemd service file for sidecar
          mkdir -p release/sidecar-package/systemd
          cp src/systemd/webbridge.service.example release/sidecar-package/systemd/

          # Version file
          echo "${{ steps.version.outputs.version }}" > release/sidecar-package/VERSION

          # README for sidecar installation
          cat > release/sidecar-package/README.md << 'EOF'
          # DVI Sidecar Web Interface Package
          
          This package contains the standalone web interface for DVI heat pumps.
          Requires the bridge basic package to be installed first.
          
          ## Installation
          1. Extract to /home/dviha/dvi-bridge/
          2. Install requirements from sidecar/requirements.txt
          3. Set up systemd service for webbridge
          4. Access web interface at http://[rpi-ip]:5555
          
          See main repository for detailed instructions.
          EOF

          # Package it
          tar czf release/dvi-sidecar-${{ steps.version.outputs.version }}.tar.gz -C release sidecar-package

          echo "== Sidecar package =="
          find release/sidecar-package -type f -print

      # -----------------------------
      # 6. Build Complete Runtime Bundle (Legacy/All-in-One)
      # -----------------------------
      - name: Build Complete Runtime Bundle
        run: |
          mkdir -p release/complete-runtime

          # Core bridge files
          cp src/bridge/bridge.py release/complete-runtime/
          cp src/bridge/read_static_values_modbustk.py release/complete-runtime/

          # Sidecar files
          mkdir -p release/complete-runtime/sidecar/www/dvi-card
          cp src/sidecar/webbridge.py release/complete-runtime/sidecar/
          cp src/sidecar/entity_map.py release/complete-runtime/sidecar/
          cp -r src/sidecar/www/* release/complete-runtime/sidecar/www/
          cp src/dvi-card/dvi-heatpump-card.js release/complete-runtime/sidecar/www/
          cp -r src/dvi-card/dvi release/complete-runtime/sidecar/www/dvi-card/

          # Version file
          echo "${{ steps.version.outputs.version }}" > release/complete-runtime/VERSION

          # Merge requirements from both bridge and sidecar
          cat src/bridge/requirements.txt > release/complete-runtime/requirements.txt
          echo "" >> release/complete-runtime/requirements.txt
          cat src/sidecar/requirements.txt >> release/complete-runtime/requirements.txt

          # systemd service files
          cp -r src/systemd release/complete-runtime/

          # Package it
          tar czf release/dvi-complete-runtime-${{ steps.version.outputs.version }}.tar.gz -C release complete-runtime

          echo "== Complete runtime package =="
          find release/complete-runtime -type f -print

      # -----------------------------
      # 7. Build Installation Scripts Package
      # -----------------------------
      - name: Build Installation Scripts Package
        run: |
          mkdir -p release/installation-scripts
          
          # Copy installation scripts
          cp -r script/* release/installation-scripts/
          
          # Copy documentation
          cp README.md release/installation-scripts/
          cp LICENSE release/installation-scripts/ || true
          
          # Package it
          tar czf release/dvi-installation-scripts-${{ steps.version.outputs.version }}.tar.gz -C release installation-scripts
          
          echo "== Installation scripts package =="
          find release/installation-scripts -type f -print

      # -----------------------------
      # 8. Publish GitHub Release
      # -----------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "Release ${{ steps.version.outputs.version }}"
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'pre') || contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'rc') }}
          body: |
            ## Installation Packages
            
            ### For Home Assistant (HACS)
            - HACS will automatically fetch the card from the `dist/` folder on branch: ${{ steps.version.outputs.branch }}
            - No manual download needed if using HACS
            
            ### For Raspberry Pi Bridge
            Choose one of these options:
            
            **Option 1: Basic Bridge Only**
            - Download: `dvi-bridge-basic-${{ steps.version.outputs.version }}.tar.gz`
            - Provides MQTT bridge to Home Assistant
            - Minimal installation, no web interface
            
            **Option 2: Bridge + Sidecar Web Interface**
            - Download both:
              - `dvi-bridge-basic-${{ steps.version.outputs.version }}.tar.gz`
              - `dvi-sidecar-${{ steps.version.outputs.version }}.tar.gz`
            - Provides MQTT bridge + standalone web interface
            
            **Option 3: Complete All-in-One**
            - Download: `dvi-complete-runtime-${{ steps.version.outputs.version }}.tar.gz`
            - Contains everything (bridge + sidecar)
            - Legacy option, use Option 1 or 2 for modular updates
            
            ### Installation Scripts
            - Download: `dvi-installation-scripts-${{ steps.version.outputs.version }}.tar.gz`
            - Contains install.sh and update.sh scripts
          files: |
            release/dvi-bridge-basic-${{ steps.version.outputs.version }}.tar.gz
            release/dvi-sidecar-${{ steps.version.outputs.version }}.tar.gz
            release/dvi-complete-runtime-${{ steps.version.outputs.version }}.tar.gz
            release/dvi-installation-scripts-${{ steps.version.outputs.version }}.tar.gz
