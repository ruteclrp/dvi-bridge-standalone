<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="/css/materialdesignicons.min.css">
  <title>DVI Heatpump</title>

  <!-- Define ha-icon FIRST -->
  <script type="module">
    class HaIcon extends HTMLElement {
      constructor() {
        super();
        this.attachShadow({ mode: "open" });
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = "/css/materialdesignicons.min.css";
        const style = document.createElement("style");
        style.textContent = `
          :host { 
            display: inline-block; 
            width: 24px; 
            height: 24px;
          }
          i { 
            font-size: 24px; 
            line-height: 1;
            color: inherit;
          }
        `;
        this.shadowRoot.append(link, style);
      }

      connectedCallback() {
        let icon = (this.getAttribute("icon") || "").replace("mdi:", "mdi-");
        const i = document.createElement("i");
        i.className = `mdi ${icon}`;
        this.shadowRoot.appendChild(i);
      }
    }
    customElements.define("ha-icon", HaIcon);

    // Define ha-card for heat-curve-card
    class HaCard extends HTMLElement {
      connectedCallback() {
        const header = this.getAttribute("header");
        if (!this.querySelector(".ha-card-header") && header) {
          const headerEl = document.createElement("div");
          headerEl.className = "ha-card-header";
          headerEl.textContent = header;
          this.prepend(headerEl);
        }
      }
      
      static get observedAttributes() {
        return ["header"];
      }
      
      attributeChangedCallback(name, oldValue, newValue) {
        if (name === "header" && this.isConnected) {
          let headerEl = this.querySelector(".ha-card-header");
          if (!headerEl) {
            headerEl = document.createElement("div");
            headerEl.className = "ha-card-header";
            this.prepend(headerEl);
          }
          headerEl.textContent = newValue;
        }
      }
    }
    customElements.define("ha-card", HaCard);

    // Define hui-entities-card for heat-curve-card controls
    class HuiEntitiesCard extends HTMLElement {
      constructor() {
        super();
        this._config = null;
        this._hass = null;
      }

      setConfig(config) {
        this._config = config;
        this._render();
      }

      set hass(hass) {
        this._hass = hass;
        this._render();
      }

      _render() {
        if (!this._config || !this._hass) return;

        const entities = this._config.entities || [];
        
        this.innerHTML = entities.map(entityId => {
          const state = this._hass.states?.[entityId];
          if (!state) return "";

          const name = state.attributes?.friendly_name || entityId;
          const stateValue = state.state;
          const domain = entityId.split(".")[0];

          // For number entities, show as input
          if (domain === "number") {
            const min = state.attributes?.min || 0;
            const max = state.attributes?.max || 100;
            const step = state.attributes?.step || 0.1;
            const unit = state.attributes?.unit_of_measurement || "";
            return `
              <div class="entity-row">
                <div class="entity-name">${name}</div>
                <div style="display: flex; align-items: center; gap: 8px;">
                  <input type="number" class="entity-control heat-curve-control" 
                    data-entity="${entityId}" 
                    value="${stateValue}" 
                    min="${min}" 
                    max="${max}" 
                    step="${step}" 
                    style="width: 100px;" />
                  ${unit ? `<span style="color: #999;">${unit}</span>` : ""}
                </div>
              </div>
            `;
          }

          // Default: show state as text
          return `
            <div class="entity-row">
              <div class="entity-name">${name}</div>
              <div class="entity-state">${stateValue}</div>
            </div>
          `;
        }).join("");

        // Add change handlers
        this.querySelectorAll(".heat-curve-control").forEach(control => {
          control.addEventListener("change", async (e) => {
            const entityId = e.target.dataset.entity;
            const value = parseFloat(e.target.value);
            
            await this._hass.callService("number", "set_value", {
              entity_id: entityId,
              value: value
            });
            
            // Refresh after change
            setTimeout(() => this._hass.refresh?.(), 500);
          });
        });
      }
    }
    customElements.define("hui-entities-card", HuiEntitiesCard);
  </script>

  <script type="module">
    import "./dvi-card/dvi-lv-heatpump-card.js";
    import "./dvi-card/dvi-lv/heat_curve_card.js";
    import "./dvi-card/dvi-lv/history_card.js";
    import { HassAdapter } from "./hass-adapter.js";

    window.addEventListener("DOMContentLoaded", async () => {
      const hass = new HassAdapter();
      await hass.refresh();

      const card = document.createElement("lv-heatpump-card");
      card.setConfig({
        outdoor_temp: "sensor.outdoor_temp",
        curve_temp: "sensor.curve_temp",
        cv_forward_temp: "sensor.cv_forward_temp",
        cv_return_temp: "sensor.cv_return_temp",
        storage_tank_cv: "sensor.storage_tank_cv_temp",
        storage_tank_vv: "sensor.storage_tank_vv_temp",
        evaporator_temp: "sensor.evaporator_temp",
        hp_temp: "sensor.compressor_hp",
        lp_temp: "sensor.compressor_lp",
        em23_power: "sensor.em23_power",
        em23_energy: "sensor.em23_energy",

        cv_mode: "select.cv_mode",
        vv_mode: "select.vv_mode",
        cv_night: "select.cv_night",
        vv_schedule: "select.vv_schedule",
        aux_heating: "select.aux_heating",

        comp_icon: "binary_sensor.soft_starter_compressor",
        cv_pump_icon: "binary_sensor.circ_pump_cv",
        defrost_icon: "binary_sensor.four_way_valve_defrost",

        // Heat curve entities (for the heat curve card popup)
        cv_curve_number: "number.cv_curve",
        curve_set_minus12_number: "number.curve_set_minus12",
        curve_set_plus12_number: "number.curve_set_plus12",
        cv_min_number: "number.cv_min",
        cv_max_number: "number.cv_max",

        info_entities: [
          "sensor.em23_energy", 
          "sensor.em23_power",
          "sensor.comp_hours",
          "sensor.vv_hours",
          "sensor.heating_hours",
        ],
        cv_entities: [
          "select.cv_mode",
          "number.cv_curve",
          "select.cv_night",
        ],
        vv_entities: [
          "number.vv_setpoint",
          "select.vv_mode",
          "select.vv_schedule",
        ],
        aux_entities: [
          "select.aux_heating",
        ],
      });


      card.hass = hass;
      document.body.appendChild(card);

      // Wire up popup functionality
      setupPopupHandler(hass);
      
      // Override temperature sensor click handlers to show history popups
      overrideTempSensorClicks(card, hass);

      // Apply Chart.js dark mode wrapper when Chart.js loads
      const chartInterval = setInterval(() => {
        if (window.Chart && !window.Chart._darkModePatched) {
          applyChartDarkMode();
          clearInterval(chartInterval);
        }
      }, 100);

      setInterval(async () => {
        await hass.refresh();
        card.hass = hass;
      }, 2000);
    });

    // Apply Chart.js dark mode wrapper
    function applyChartDarkMode() {
      if (!window.Chart || window.Chart._darkModePatched) return;
      
      const OriginalChart = window.Chart;
      window.Chart = function(ctx, config) {
        // Comprehensive dark mode color injection
        if (config?.options?.scales) {
          // X axis
          if (config.options.scales.x) {
            config.options.scales.x.grid = config.options.scales.x.grid || {};
            config.options.scales.x.grid.color = 'rgba(255,255,255,0.3)';
            config.options.scales.x.grid.borderColor = 'rgba(255,255,255,0.5)';
            config.options.scales.x.ticks = config.options.scales.x.ticks || {};
            config.options.scales.x.ticks.color = '#fff';
            if (config.options.scales.x.title) {
              config.options.scales.x.title.color = '#fff';
            }
          }
          // Y axis
          if (config.options.scales.y) {
            config.options.scales.y.grid = config.options.scales.y.grid || {};
            config.options.scales.y.grid.color = 'rgba(255,255,255,0.3)';
            config.options.scales.y.grid.borderColor = 'rgba(255,255,255,0.5)';
            config.options.scales.y.ticks = config.options.scales.y.ticks || {};
            config.options.scales.y.ticks.color = '#fff';
            if (config.options.scales.y.title) {
              config.options.scales.y.title.color = '#fff';
            }
          }
        }
        // Legend
        if (config?.options?.plugins?.legend?.labels) {
          config.options.plugins.legend.labels.color = '#fff';
        }
        // Tooltip
        if (config?.options?.plugins?.tooltip) {
          config.options.plugins.tooltip.titleColor = '#fff';
          config.options.plugins.tooltip.bodyColor = '#fff';
        }
        return new OriginalChart(ctx, config);
      };
      // Copy static properties
      Object.setPrototypeOf(window.Chart, OriginalChart);
      Object.assign(window.Chart, OriginalChart);
      window.Chart._darkModePatched = true;
      console.log('✅ Chart.js dark mode applied');
    }

    // Override temperature sensor click handlers to show history popups
    function overrideTempSensorClicks(card, hass) {
      console.log('🔧 overrideTempSensorClicks called');
      const shadowRoot = card.shadowRoot;
      if (!shadowRoot) {
        console.log('❌ No shadowRoot found');
        return;
      }
      console.log('✅ shadowRoot found');
      
      const friendlyNames = {
        'outdoor': 'Outdoor',
        'tankCv': 'Storage tank CV',
        'tankVv': 'Storage tank VV',
        'cvForward': 'CV Forward',
        'cvReturn': 'CV Return',
        'evap': 'Evaporator',
        'hp': 'Compressor HP',
        'lp': 'Compressor LP'
      };
      
      // Map camelCase keys to entity map keys for API calls
      const keyToEntityMap = {
        'outdoor': 'outdoor_temp',
        'tankCv': 'storage_tank_cv',
        'tankVv': 'storage_tank_vv',
        'cvForward': 'cv_forward_temp',
        'cvReturn': 'cv_return_temp',
        'evap': 'evaporator_temp',
        'hp': 'compressor_hp_temp',
        'lp': 'compressor_lp_temp'
      };
      
      // Function to override click handlers on temperature labels
      function overrideHandlers() {
        const diagram = shadowRoot.querySelector('.diagram');
        if (!diagram) {
          console.log('⏳ Diagram not yet ready');
          return;
        }
        
        // Find all temperature sensor labels
        const allLabels = diagram.querySelectorAll('.diagram-label');
        const clickableLabels = diagram.querySelectorAll('.diagram-label.clickable');
        console.log(`🔍 Found ${allLabels.length} total labels, ${clickableLabels.length} clickable`);
        
        let overriddenCount = 0;
        
        clickableLabels.forEach(label => {
          const dataKey = label.getAttribute('data-key');
          console.log(`  - Label with data-key: ${dataKey}, clickable: ${label.classList.contains('clickable')}`);
          
          // Check if this is a temperature sensor key
          if (!dataKey || !friendlyNames[dataKey]) {
            console.log(`    ⏭️ Skipping (not in temperature sensor list)`);
            return;
          }
          
          // Check if already overridden
          if (label._historyOverridden) {
            console.log(`    ⏭️ Already overridden`);
            return;
          }
          label._historyOverridden = true;
          
          // Store the old handler for debugging
          const oldHandler = label.onclick;
          console.log(`    📝 Old handler: ${oldHandler ? 'exists' : 'null'}`);
          
          // Override the click handler
          label.onclick = (e) => {
            console.log(`🖱️ Click detected on ${dataKey}!`);
            e.preventDefault();
            e.stopPropagation();
            
            const friendlyName = friendlyNames[dataKey];
            const sensorKey = keyToEntityMap[dataKey];
            
            hass.popupCallback({
              title: `${friendlyName} - 24h History`,
              content: {
                type: "custom:history-card",
                sensor: sensorKey,
                title: friendlyName
              }
            });
          };
          
          console.log(`    ✅ Override installed for ${dataKey}`);
          overriddenCount++;
        });
        
        if (overriddenCount > 0) {
          console.log(`✅ Overrode ${overriddenCount} temperature sensor click handlers`);
        }
      }
      
      // Use MutationObserver to detect when diagram is populated
      const observer = new MutationObserver((mutations) => {
        console.log(`🔄 MutationObserver triggered (${mutations.length} mutations)`);
        overrideHandlers();
      });
      
      observer.observe(shadowRoot, {
        childList: true,
        subtree: true
      });
      
      console.log('👀 MutationObserver installed');
      
      // Also run immediately in case diagram is already there
      overrideHandlers();
    }

    // Popup handler setup - intercepts browser_mod.popup calls
    function setupPopupHandler(hass) {
      const modal = document.getElementById("modal-overlay");
      const modalTitle = document.getElementById("modal-title");
      const modalBody = document.getElementById("modal-body");
      const modalClose = document.getElementById("modal-close");

      // Close modal handlers
      modalClose.onclick = () => modal.classList.remove("active");
      modal.onclick = (e) => {
        if (e.target === modal) modal.classList.remove("active");
      };

      // Set popup callback to intercept browser_mod.popup service calls
      hass.popupCallback = (data) => {
        const { title, content } = data;
        
        // Handle history card popup
        if (content && content.type === "custom:history-card") {
          modalTitle.textContent = title || "Temperature History";
          
          (async () => {
            // Ensure Chart.js is loaded
            if (!window.Chart) {
              await import("https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js");
            }
            
            // Apply dark mode wrapper
            applyChartDarkMode();
            
            // Create history card
            const historyCard = document.createElement("history-card");
            historyCard.setConfig({
              sensor: content.sensor,
              title: content.title || title
            });
            historyCard.hass = hass;
            
            modalBody.innerHTML = "";
            modalBody.appendChild(historyCard);
          })();
          
          modal.classList.add("active");
          return;
        }
        
        // Handle heat-curve card popup (custom card)
        if (content && content.type === "custom:heat-curve-card") {
          modalTitle.textContent = title || "Heat Curve";
          
          // Load Chart.js and apply dark mode BEFORE creating the card
          (async () => {
            // Ensure Chart.js is loaded
            if (!window.Chart) {
              await import("https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js");
            }
            
            // Apply dark mode wrapper
            applyChartDarkMode();
            
            // Now create the heat-curve-card
            const heatCurveCard = document.createElement("heat-curve-card");
            
            heatCurveCard.setConfig({
              title: content.title || title,
              entities: content.entities
            });
            heatCurveCard.hass = hass;
            
            // Clear modal body and append the card
            modalBody.innerHTML = "";
            modalBody.appendChild(heatCurveCard);
          })();
          
          modal.classList.add("active");
          return;
        }

        // Handle regular entity list popup
        if (!content || !content.entities) return;

        // Set title
        modalTitle.textContent = title || "Details";

        // Build entity rows - support both array and object formats
        const entities = Array.isArray(content.entities) ? content.entities : Object.values(content.entities);
        
        modalBody.innerHTML = entities.map(entityId => {
          const state = hass.states[entityId];
          if (!state) return "";

          const name = state.attributes?.friendly_name || entityId;
          const stateValue = state.state;
          const unit = state.attributes?.unit_of_measurement || "";
          const domain = entityId.split(".")[0];

          // For select entities, show as dropdown
          if (domain === "select" && state.attributes?.options) {
            const options = state.attributes.options.map(opt => 
              `<option value="${opt}" ${opt === stateValue ? "selected" : ""}>${opt}</option>`
            ).join("");
            return `
              <div class="entity-row">
                <div class="entity-name">${name}</div>
                <select class="entity-control" data-entity="${entityId}" data-domain="${domain}">
                  ${options}
                </select>
              </div>
            `;
          }

          // For number entities, show as input
          if (domain === "number") {
            const min = state.attributes?.min || 0;
            const max = state.attributes?.max || 100;
            const step = state.attributes?.step || 1;
            return `
              <div class="entity-row">
                <div class="entity-name">${name}</div>
                <input type="number" class="entity-control" data-entity="${entityId}" data-domain="${domain}" 
                  value="${stateValue}" min="${min}" max="${max}" step="${step}" />
              </div>
            `;
          }

          // Default: show state as text
          return `
            <div class="entity-row">
              <div class="entity-name">${name}</div>
              <div class="entity-state">${stateValue}${unit ? " " + unit : ""}</div>
            </div>
          `;
        }).join("");

        // Add change handlers for controls
        setTimeout(() => {
          modalBody.querySelectorAll(".entity-control").forEach(control => {
            control.addEventListener("change", async (e) => {
              const entityId = e.target.dataset.entity;
              const domain = e.target.dataset.domain;
              const value = e.target.value;
              
              if (domain === "select") {
                await hass.callService("select", "select_option", {
                  entity_id: entityId,
                  option: value
                });
              } else if (domain === "number") {
                await hass.callService("number", "set_value", {
                  entity_id: entityId,
                  value: parseFloat(value)
                });
              }
              
              // Refresh states after change
              setTimeout(() => hass.refresh(), 500);
            });
          });
        }, 0);

        // Show modal
        modal.classList.add("active");
      };
    }
  </script>

  <script>
    (function () {
      const orig = Element.prototype.attachShadow;
      Element.prototype.attachShadow = function (init) {
        const root = orig.call(this, init);
        const style = document.createElement("style");
        style.textContent = `
          :host { 
            --disabled-text-color: #999;
            --primary-text-color: #000 !important;
            --chip-text-color: #000 !important;
            --chip-active-text: #000 !important;
            --state-climate-heat-color: #ff9800;
            --state-water-heater-heat-color: #ff9800;
            --warning-color: #fdd835;
            --accent-color: #03a9f4;
          }
          ha-icon { color: inherit; }
          .diagram-icon, .diagram-element { color: inherit; }
        `;
        root.appendChild(style);
        
        // Observer to fix chip label colors based on active/inactive state
        const updateChipLabels = () => {
          root.querySelectorAll('.chip-label, .chip-value').forEach(el => {
            const chip = el.closest('.mode-chip');
            if (chip && chip.classList.contains('mode-chip--inactive')) {
              el.style.color = '#999';
            } else {
              el.style.color = '#000';
            }
          });
        };
        
        const observer = new MutationObserver(updateChipLabels);
        observer.observe(root, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });
        
        // Initial update
        setTimeout(updateChipLabels, 0);
        
        return root;
      };
    })();
  </script>
</head>
