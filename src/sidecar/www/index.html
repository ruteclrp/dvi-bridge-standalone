<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="/css/materialdesignicons.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <title>DVI Heatpump</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <!-- modularized JS -->
  <script type="module" src="/js/ha-elements.js"></script>
  <script type="module" src="/js/app.js"></script>
  <script src="/js/attach-shadow-patch.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>



<body style="margin:0; background:#111;">
  <!-- Login Modal -->
  <div id="login-overlay" class="login-overlay">
    <div class="login-modal">
      <div class="login-header">
        <h2>DVI Heatpump</h2>
        <p>Authentication required</p>
      </div>
      <div id="login-error" class="login-error" style="display:none;"></div>
      <form id="login-form" class="login-form">
        <div class="login-form-group">
          <label for="login-username">Username</label>
          <input type="text" id="login-username" name="username" autocomplete="username" required>
        </div>
        <div class="login-form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" id="login-button" class="login-button">
          <span id="login-button-text">Login</span>
          <div id="login-spinner" class="login-spinner" style="display:none;"></div>
        </button>
      </form>
    </div>
  </div>

  <!-- Modal Popup -->
  <div id="modal-overlay" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title" id="modal-title"></div>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>
</body>
</html>
